# CI: what scripts/check.sh does, decomposed across jobs so it finishes in parallel.
#
# check.sh runs four presets serially and then the equivalence harness — about twenty minutes on a
# quiet laptop and considerably more on a shared runner. So the same work is split: one job per
# (operating system, compiler, preset), and one job per example for the equivalence harness against
# the checked-in references. The union of these jobs is check.sh; nothing is verified here that
# check.sh does not verify locally, and nothing that check.sh verifies is left out.
#
# What is deliberately NOT here:
#
#   * **The upstream baseline is not built.** It needs four macOS-specific shims, an old vcpkg
#     baseline and about fifteen minutes (docs/build-notes.md), and CI does not need it: the
#     equivalence harness runs in `--use-reference` mode against the two baseline reductions that are
#     checked into tests/equivalence/reference/. Refreshing a reference is a deliberate local act.
#   * **`HLM_India` is not compared here.** Its comparison is at a reduced `size_fraction` and its
#     reference is not checked in (docs/equivalence.md); running it would be forty minutes a job.
#
# **The two TSan entries run 761 tests where the others run 853**, and that is deliberate rather than
# a gap: under ThreadSanitizer the parameterised suite runs against the first fixture pack only and
# the harness's self-checks at six seeds, because a race is a property of the code and not of the
# configuration that reaches it, and running the same races twice had made the macOS TSan job 88
# minutes — the workflow's long pole by a wide margin
# (docs/decisions/0046-what-runs-under-which-sanitizer.md). The decision is taken in the test code,
# not here, so a local `ctest --preset tsan` and this job agree about what they run.
#
# GCC is required, and was not until the sixth run. The two GCC entries carried `experimental: true` —
# `continue-on-error` — because nothing knew what a second compiler family would say about a warning
# set (-Werror with -Wconversion, -Wsign-conversion, -Wold-style-cast and -Wdouble-promotion) that
# only clang had ever seen, and a red tick in a commit that cannot act on it is a red tick nobody
# reads. It said four things, all of them real defects, all fixed (docs/build-notes.md); GCC has been
# green on both presets since. The flag has done its job, so a GCC regression now fails the build
# instead of being reported quietly, which is the whole reason for having the entries.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the previous run's answer uninteresting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The vcpkg commit vcpkg.json declares as its builtin-baseline. Pinned here too, so the checkout
  # certainly contains it — resolving a baseline vcpkg has never fetched is the usual way this fails.
  VCPKG_COMMIT: bd2b54836beed96e1efbe9aaf8ee800f5448856d
  # The upstream example configs and their input data. The tests convert and load all six examples,
  # and the equivalence harness reads two of them, so this is not optional.
  EXAMPLES_REPO: imperialCHEPI/healthgps-examples

jobs:
  # ---------------------------------------------------------------------------------------------
  # The four presets, on two operating systems and — on Linux — two compiler families.
  #
  # `include:` rather than a cross product, because the product is not what is wanted: macOS has one
  # compiler (Apple clang, which is what every measurement in docs/ was taken with), and GCC runs two
  # presets rather than four, since a compiler that has never built this tree will be judged by its
  # warnings long before its sanitizer runs are interesting.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One preset failing should not hide what the others would have said.
      fail-fast: false
      matrix:
        include:
          - {name: "linux · clang · release",      os: ubuntu-latest, preset: release,     cc: clang, cxx: clang++, id: linux-clang}
          - {name: "linux · clang · debug",        os: ubuntu-latest, preset: debug,       cc: clang, cxx: clang++, id: linux-clang}
          - {name: "linux · clang · asan-ubsan",   os: ubuntu-latest, preset: asan-ubsan,  cc: clang, cxx: clang++, id: linux-clang}
          - {name: "linux · clang · tsan",         os: ubuntu-latest, preset: tsan,        cc: clang, cxx: clang++, id: linux-clang}
          - {name: "linux · gcc · release",        os: ubuntu-latest, preset: release,     cc: gcc,   cxx: g++,     id: linux-gcc}
          - {name: "linux · gcc · debug",          os: ubuntu-latest, preset: debug,       cc: gcc,   cxx: g++,     id: linux-gcc}
          - {name: "macos · appleclang · release",     os: macos-latest, preset: release,    id: macos-appleclang}
          - {name: "macos · appleclang · debug",       os: macos-latest, preset: debug,      id: macos-appleclang}
          - {name: "macos · appleclang · asan-ubsan",  os: macos-latest, preset: asan-ubsan, id: macos-appleclang}
          - {name: "macos · appleclang · tsan",        os: macos-latest, preset: tsan,       id: macos-appleclang}

    steps:
      # First, because a local composite action cannot be resolved until its repository is on disk.
      - name: Check out the implementation
        uses: actions/checkout@v4
        with:
          path: hgps_new_rewrite

      - name: Prepare
        uses: ./hgps_new_rewrite/.github/actions/prepare
        with:
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}
          examples-repo: ${{ env.EXAMPLES_REPO }}
          cache-id: ${{ matrix.id }}
          # All six: tests/config/convert_config_test.cpp converts and checks every one of them, and
          # tests/config/*_loader_test.cpp read the FINCH pack's model files directly.
          examples: |
            Dummy_disease_test
            HLM_France
            HLM_India
            KevinHall_FINCH
            KevinHall_India
            KevinHall_PIF

      - name: Name the compiler
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          # macOS entries set neither, and get Apple clang — the compiler docs/performance.md and
          # docs/build-notes.md quote. Recording the version is what makes a later "it passed on CI"
          # checkable.
          if [ -n "${CXX:-}" ]; then
            echo "CC=$CC"   >> "$GITHUB_ENV"
            echo "CXX=$CXX" >> "$GITHUB_ENV"
            "$CXX" --version
          else
            c++ --version
          fi

      - name: Configure
        working-directory: hgps_new_rewrite
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: hgps_new_rewrite
        run: cmake --build --preset ${{ matrix.preset }}

      # The unit tests and the equivalence harness's own tests in one command: the harness's Python
      # tests are registered with CTest (EquivalenceHarness.Rules, .SelfConsistencyAcrossSeeds and
      # .DetectsADeliberatePerturbation), so `ctest` covers both. --output-on-failure, because a
      # runner log is the only thing a reader will have.
      - name: Test
        working-directory: hgps_new_rewrite
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Upload the failing test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.id }}-${{ matrix.preset }}
          path: hgps_new_rewrite/out/build/${{ matrix.preset }}/Testing/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # The graphical host: type-check, tests, build.
  #
  # Cheap and fast — no C++, no data pack, no vcpkg — so it is its own job and reports on its own
  # rather than waiting behind twenty minutes of sanitizer. It does NOT run the server: the
  # frontend's correctness test is the server's byte-identity test, which the build jobs run
  # (docs/decisions/0043-a-plain-typescript-frontend.md).
  #
  # `npm ci` rather than `npm install`, so the lockfile is what decides and a run cannot silently
  # pick up a new minor version of something.
  frontend:
    name: web · typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exactly what the lockfile says
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Last, because it is the slowest and because a type error is the more useful message.
      - name: Build
        run: npx vite build

      # What `hgps serve --web` would host. Kept for 7 days so a failing run can be looked at
      # without reproducing the build.
      - name: Upload the built frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # The graphical host, driven by a browser: the built frontend, the real `hgps serve`, the real
  # engine, over the two synthetic fixture packs.
  #
  # Its own job because it needs both halves — a release build of the C++ and a built frontend — and
  # because a failure here is a different kind of news from a failure in either. It is the only job
  # that exercises the wiring: the previous run found three defects by a person opening the page in
  # a browser and none by a test (docs/SUMMARY.md), and a fourth turned up the first time these
  # tests ran (docs/decisions/0045-end-to-end-tests-in-a-real-browser.md).
  #
  # The data pack is not needed: the synthetic packs are generated by `gen-fixtures`, so this job
  # does not fetch the disease data and does not need the examples repository for anything but the
  # build's own tests — which it does not run.
  e2e:
    name: web · end-to-end
    runs-on: ubuntu-latest

    steps:
      - name: Check out the implementation
        uses: actions/checkout@v4
        with:
          path: hgps_new_rewrite

      - name: Prepare
        uses: ./hgps_new_rewrite/.github/actions/prepare
        with:
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}
          examples-repo: ${{ env.EXAMPLES_REPO }}
          cache-id: linux-clang
          # The build needs the examples directory to exist for its compile definitions; the
          # smallest one is enough, because nothing in this job reads an upstream example.
          examples: |
            Dummy_disease_test

      - name: Build the engine (release)
        working-directory: hgps_new_rewrite
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset release
          cmake --build --preset release --target healthgps gen-fixtures

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hgps_new_rewrite/web/package-lock.json

      - name: Install exactly what the lockfile says
        working-directory: hgps_new_rewrite/web
        run: npm ci

      - name: Build the frontend
        working-directory: hgps_new_rewrite/web
        run: npx vite build

      # Chromium only. The frontend uses no browser feature newer than `fetch` and `<details>`, and
      # a second engine would double a job that already builds a C++ project to find the same
      # defects.
      - name: Install the browser
        working-directory: hgps_new_rewrite/web
        run: npx playwright install --with-deps chromium

      - name: Drive it
        working-directory: hgps_new_rewrite/web
        run: npx playwright test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            hgps_new_rewrite/web/playwright-report
            hgps_new_rewrite/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Timings, on Linux, which is the platform every number in docs/performance.md is not.
  #
  # Every figure in that document was taken on one macOS laptop with Apple clang, and the document
  # says so under what a reader should be sceptical about. This job is the first Linux measurement
  # of anything. It runs `scripts/measure.sh` — the same script a person runs — and uploads its JSON.
  #
  # **Indicative only, and nothing here can fail the build.** A GitHub-hosted runner is a shared
  # virtual machine with neighbours: the same job on the same commit has been seen to vary by tens
  # of percent, which is larger than any difference docs/performance.md discusses. So there is no
  # threshold, no comparison against a stored number and no `exit 1` on a slow run. What the numbers
  # are worth is an order of magnitude and the ratio between two examples measured in one job.
  performance:
    name: performance · linux · indicative
    runs-on: ubuntu-latest

    steps:
      - name: Check out the implementation
        uses: actions/checkout@v4
        with:
          path: hgps_new_rewrite

      - name: Prepare
        uses: ./hgps_new_rewrite/.github/actions/prepare
        with:
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}
          examples-repo: ${{ env.EXAMPLES_REPO }}
          cache-id: linux-clang
          examples: |
            HLM_France
            KevinHall_FINCH

      # The same cache the equivalence jobs use: the disease data is fetched from a release URL and
      # verified against the checksum the config declares (ADR 0011), so a cache hit is a directory
      # the engine has already verified.
      - name: Cache the extracted data pack
        uses: actions/cache@v4
        with:
          path: ~/.cache/healthgps
          key: healthgps-data-${{ hashFiles('hgps_new_rewrite/examples/HLM_France/config.json') }}
          restore-keys: |
            healthgps-data-

      - name: Build (release)
        working-directory: hgps_new_rewrite
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset release
          cmake --build --preset release

      # GNU time, for the peak resident set size. The shell builtin does not report it.
      - name: Install /usr/bin/time
        run: sudo apt-get install -y time

      - name: Measure
        working-directory: hgps_new_rewrite
        run: |
          echo "::group::runner"
          nproc && free -g && cat /proc/cpuinfo | grep -m1 "model name" || true
          echo "::endgroup::"
          scripts/measure.sh --runs 3 --json out/timings-linux.json

      - name: Upload the timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-linux
          path: hgps_new_rewrite/out/timings-linux.json
          if-no-files-found: warn
          retention-days: 90

  # ---------------------------------------------------------------------------------------------
  # The column inventory: every column of every output family, on both sides, and which of them are
  # identically zero.
  #
  # This is the check that would have caught the 49. A statistical comparison cannot express "the
  # baseline has numbers here and we have nothing": a column of zeros against a column of numbers
  # either fails for ever or — where the column is legitimately absent for an example — is skipped
  # on both sides and says nothing. So this job asks of the files themselves, and fails when a
  # column is present in the baseline, present here, identically zero here and not identically zero
  # in the baseline.
  #
  # It needs no baseline binary: the baseline's inventory is stored beside its reduction and keyed
  # by the same hash of the same derived config. All three runnable examples, `HLM_India` at the
  # hundredth of its cohort the harness compares it at.
  column-coverage:
    name: column coverage · three examples
    runs-on: ubuntu-latest

    steps:
      - name: Check out the implementation
        uses: actions/checkout@v4
        with:
          path: hgps_new_rewrite

      - name: Prepare
        uses: ./hgps_new_rewrite/.github/actions/prepare
        with:
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}
          examples-repo: ${{ env.EXAMPLES_REPO }}
          cache-id: linux-clang
          examples: |
            HLM_France
            KevinHall_FINCH
            HLM_India

      - name: Cache the extracted data pack
        uses: actions/cache@v4
        with:
          path: ~/.cache/healthgps
          key: healthgps-data-${{ hashFiles('hgps_new_rewrite/examples/HLM_France/config.json', 'hgps_new_rewrite/examples/KevinHall_FINCH/config.json', 'hgps_new_rewrite/examples/HLM_India/config.json') }}
          restore-keys: |
            healthgps-data-

      - name: Build (release)
        working-directory: hgps_new_rewrite
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Inventory every column of every output family
        working-directory: hgps_new_rewrite
        run: scripts/column-coverage.py --json out/column-coverage.json

      - name: Upload the inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: column-coverage
          path: hgps_new_rewrite/out/column-coverage.json
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------------------------
  # Statistical equivalence against the baseline, without building the baseline: the two reductions
  # of its output are checked in, and the harness compares this build against them. That is the half
  # of the validation a unit test cannot do, and until this workflow existed nothing ran it
  # automatically — which is what docs/backlog.md meant by "a harness nobody runs is a document".
  equivalence:
    name: equivalence · ${{ matrix.example }} · 20 seeds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [HLM_France, KevinHall_FINCH]

    steps:
      # First, because a local composite action cannot be resolved until its repository is on disk.
      - name: Check out the implementation
        uses: actions/checkout@v4
        with:
          path: hgps_new_rewrite

      - name: Prepare
        uses: ./hgps_new_rewrite/.github/actions/prepare
        with:
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}
          examples-repo: ${{ env.EXAMPLES_REPO }}
          cache-id: linux-clang
          examples: |
            HLM_France
            KevinHall_FINCH

      # The disease data is CC BY-NC-ND and is not vendored (ADR 0011): it is fetched from a release
      # URL and verified against the SHA-256 the config declares, then extracted into a
      # content-addressed cache. Caching that directory is caching a verified artefact — the checksum
      # is in the config, which is in the key, and a cache hit is a directory the engine has already
      # verified. Keyed on the config file, so a config that names a different pack misses.
      - name: Cache the extracted data pack
        uses: actions/cache@v4
        with:
          path: ~/.cache/healthgps
          key: healthgps-data-${{ hashFiles(format('hgps_new_rewrite/examples/{0}/config.json', matrix.example)) }}
          restore-keys: |
            healthgps-data-

      - name: Build (release)
        working-directory: hgps_new_rewrite
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset release
          cmake --build --preset release

      # The harness against itself, first and cheaply: the same build at two disjoint seed sets must
      # pass, and a deliberately perturbed copy of it must fail on exactly the perturbed series. Both
      # run against the synthetic fixture pack, in seconds, and they are what says the comparison
      # below means anything — a harness that always says PASS would pass it too.
      # docs/equivalence-method.md §7.
      - name: The harness against itself
        working-directory: hgps_new_rewrite
        run: |
          python3 tests/equivalence/self_check.py --mode seeds --example Synthetic --seeds 20
          python3 tests/equivalence/self_check.py --mode perturbation --example Synthetic --seeds 20

      # No --max-failures: the default is zero and nothing here raises it (docs/equivalence.md,
      # "There is no failure budget").
      - name: Compare against the checked-in baseline reference
        working-directory: hgps_new_rewrite
        run: |
          python3 tests/equivalence/run.py \
            --example ${{ matrix.example }} --seeds 20 --use-reference \
            --json "out/equivalence-${{ matrix.example }}.json"

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-${{ matrix.example }}
          path: hgps_new_rewrite/out/equivalence-${{ matrix.example }}.json
          if-no-files-found: warn
          retention-days: 30
